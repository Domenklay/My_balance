name: Godot UI Visual Check
on:
  push:
    branches: [main]
    paths:
      - "godot/tests/visual_snapshot.gd"
      - "godot/src/**"
      - "tools/bundle_recipe_photos.py"
      - "godot/assets/**"
      - "godot/icon.svg"
      - "godot/project.godot"
      - ".github/workflows/godot-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup screenshot environment
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          fi
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/bin
          mv /tmp/bin/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
      - name: Bundle offline recipe photographs
        run: python3 tools/bundle_recipe_photos.py
      - name: Capture actual Godot screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/screenshots
          # Import SVG textures before running the SceneTree screenshot script.
          # Without the editor import, Godot cannot preload SVG UI icons.
          /tmp/godot --headless --editor --path godot --quit 2>&1 | tee /tmp/godot-import-log.txt
          timeout --signal=SIGINT --kill-after=5s 90s env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24" /tmp/godot --path godot --rendering-method gl_compatibility --script res://tests/visual_snapshot.gd 2>&1 | tee /tmp/visual-log.txt
          test "$(find godot/screenshots -maxdepth 1 -name '*.png' | wc -l)" -ge 5
          ls -lh godot/screenshots/*.png
      - name: Upload screenshot gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mybalance-visual-screenshots
          path: godot/screenshots/*.png
          if-no-files-found: warn
      - name: Upload visual diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mybalance-visual-log
          path: /tmp/visual-log.txt
          if-no-files-found: warn
