name: Godot Android APK

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - "android_scanner/**"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ${{ vars.GODOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
      - name: Install Godot 4.6.3 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.6.3-stable"
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mv "/tmp/godot-bin/Godot_v${VERSION}_linux.x86_64" /tmp/godot
          chmod +x /tmp/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz"
          mkdir -p "/home/runner/.local/share/godot/export_templates/4.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "/home/runner/.local/share/godot/export_templates/4.6.3.stable/"
          /tmp/godot --headless --version
      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mybalance-signing
          key: mybalance-godot-debug-key-v1
      - name: Configure Godot Android exporter
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$HOME/.local/share/mybalance-signing"
          mkdir -p "$HOME/.config/godot" "$SIGNING_DIR"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          if [ ! -f "$SIGNING_DIR/debug.keystore" ]; then
            echo "::warning::Creating an initial debug key. Existing 0.5.1 APK signatures cannot be reused."
            keytool -genkeypair -noprompt -keystore "$SIGNING_DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=MyBalance Test,O=MyBalance,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$SIGNING_DIR/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Install Gradle template and Google Code Scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/android/build
          unzip -q "$HOME/.local/share/godot/export_templates/4.6.3.stable/android_source.zip" -d godot/android/build
          printf '4.6.3.stable' > godot/android/.build_version
          touch godot/android/build/.gdignore
          python3 android_scanner/patch_template.py
          find godot/android/build -maxdepth 3 -name build.gradle -o -name AndroidManifest.xml
      - name: Validate project scripts and import resources
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot --headless --editor --path godot --quit --verbose 2>&1 | tee /tmp/mybalance-parse.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call\\.|Invalid operands|Failed to load script" /tmp/mybalance-parse.log; then
            echo "Godot reported a script parse/runtime error"
            exit 1
          fi
      - name: Validate new app launcher icon
        run: /tmp/godot --headless --path godot --script res://tests/launcher_icon_test.gd
      - name: Verify journal save and restore
        run: /tmp/godot --headless --path godot --script res://tests/storage_test.gd
      - name: Test barcode parsing and offline nutrition cache
        run: /tmp/godot --headless --path godot --script res://tests/barcode_test.gd
      - name: Verify touch swipe and scroll range across tabs
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/scroll_test.gd
      - name: Test themes, dark mode, ornaments and saved settings
        run: /tmp/godot --headless --path godot --script res://tests/theme_test.gd
      - name: Test five polished bottom navigation icons and theme colors
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/navigation_icons_test.gd
      - name: Test unified meal icons and softer day card visuals
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/meal_visual_style_test.gd
      - name: Test Botanical Contrast theme, foliage and compact UI
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/botanical_theme_test.gd
      - name: Verify compact day cards, navigation, note and calorie editing
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/day_dashboard_polish_test.gd
      - name: Verify first upgrade activates botanical UI without losing data or manual themes
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/botanical_default_test.gd
      - name: Test recipe calculations, history and personal profile
        run: /tmp/godot --headless --path godot --script res://tests/recipe_profile_test.gd
      - name: Test 0.7.36 recipe favorites, quick repeats, cooked weight and ingredient units
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/recipes_0736_test.gd
      - name: Test illustrated recipe cards, photographs, per-serving values and safe editing
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/recipe_cards_0726_test.gd
      - name: Test first-launch questionnaire, calorie estimate, legacy update and manual override
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/onboarding_test.gd
      - name: Test direct manual calorie goal editing, persistence and meal allocation
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/calorie_goal_edit_test.gd
      - name: Test profile weight goal and quick navigation actions
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/profile_dashboard_test.gd
      - name: Test v0.7.39 three-month reports, previous-period comparisons and full weight trend
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/stats_0739_test.gd
      - name: Test week/month stats, accurate averages, month boundaries and charts
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/stats_dashboard_0728_test.gd
      - name: Test optional weekly graph and weight widgets, migrations and preferences
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/home_widgets_0729_test.gd
      - name: Test compact home and profile, collapsible notes and rewards
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/compact_layout_test.gd
      - name: Verify square header and one-row day meals with preserved interactions
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/visual_polish_test.gd
      - name: Test positive rewards, achievement frames, image avatar and JSON migration
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/rewards_avatar_test.gd
      - name: Test food search, favorites and quick-add UI
        run: /tmp/godot --headless --path godot --script res://tests/ui_test.gd
      - name: Test date-specific breakfast, lunch, dinner and snack sections
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/daily_meals_test.gd
      - name: Test direct meal search, barcode scanner and manual EAN flows
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/direct_meal_add_test.gd
      - name: Test recent products, quick repeats, favorites and search discovery
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/recent_product_search_test.gd
      - name: Test product sorting, frequent shortcuts and meal-safe quick add
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/food_sort_frequency_test.gd
      - name: Test catalog search pagination beyond first twelve products
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/food_search_pagination_test.gd
      - name: Test Google Drive backup UI fails closed on desktop without Android plugin
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/google_cloud_backup_0751_test.gd
      - name: Verify Google Drive checked-revision guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path("android_scanner/src/main/java/com/domenklay/mybalance/cloud/MyBalanceGoogleDrive.java").read_text()
          assert "matchesExpected(file, expectedId, expectedMd5)" in code
          assert "md5Hex(content.body).equalsIgnoreCase(expectedMd5)" in code
          assert "downloadBackup(String expectedId, String expectedMd5)" in code
          assert "deleteBackup(String expectedId, String expectedMd5)" in code
          assert "uploadBackup(String json, String expectedMd5, String expectedId)" in code
          print("PASS: Google Drive safe revision operations")
          PY
      - name: Test five distinctive palettes, high contrast and theme previews 0.7.50.1
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/five_distinct_themes_0750_1_test.gd
      - name: Test 0.7.50 weekly meal planning and shopping from saved ingredients
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/meal_planner_0750_test.gd
      - name: Test 0.7.49 hydration journal, editable goal, migration and day UI
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/water_0749_test.gd
      - name: Test 0.7.48 interactive body diagram, metric selection and unsaved draft safety
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/body_map_0748_test.gd
      - name: Test 0.7.47 graph period filters, history sampling and weight/body UI
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/progress_graph_0747_test.gd
      - name: Test 0.7.46 design system, botanical contrast and preserved controls
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/visual_system_0746_test.gd
      - name: Test 0.7.45 body measurements, graphs, editing, migration and UI
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/body_measurements_0745_test.gd
      - name: Test 0.7.44 five-tab layout, direct meal search and combined progress
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/simple_ui_0744_test.gd
      - name: Test 0.7.61 reminder settings, opt-in schedule and migration
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/reminders_0761_test.gd
      - name: Test 0.7.60 optional macro targets, calculation, editor and migration
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/macro_goals_0760_test.gd
      - name: Test 0.7.58 optional motion, empty states and legacy settings
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/polish_0758_test.gd
      - name: Test 0.7.57 profile avatar, achievement milestones and five themes
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/profile_design_0757_test.gd
      - name: Test 0.7.56 progress graph point selection and themed body diagram
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/progress_design_0756_test.gd
      - name: Test 0.7.55 product cards, favorites and recipe grid
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/catalog_design_0755_test.gd
      - name: Test 0.7.54 semantic day dashboard in all five themes
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/day_design_0754_test.gd
      - name: Test 0.7.53 compact sport dashboard in all five themes
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/sport_layout_0753_test.gd
      - name: Test 0.7.43 activity, manual steps, estimated energy, week totals and migration
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/activity_0743_test.gd
      - name: Test 0.7.42 barcode discovery, local saved products, exact repeats and live label review
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/food_catalog_0742_test.gd
      - name: Test Russian text, online product search and correct nutrition data
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/russian_product_search_test.gd
      - name: Test barcode photo, missing values, package size and label review
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/barcode_review_0731_test.gd
      - name: Verify 100g/100ml nutrition basis, compact catalog and barcode entry
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/catalog_0723_test.gd
      - name: Test per-meal calories, macros, editable shares and legacy JSON
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/meal_targets_test.gd
      - name: Test 0.7.41 calendar, duplicate-safe copy, persisted undo and editable meal sets
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/smart_diary_0741_test.gd
      - name: Test 0.7.40 smart diary, atomic day copy and meal templates
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/smart_diary_0740_test.gd
      - name: Test compact journal, overage, safe repeats, live percentages and ml units
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/compact_diary_test.gd
      - name: Test v0.7.38 compact settings, live recipe search and period statistics
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/ui_compact_0738_test.gd
      - name: Test v0.7.37 navigation, barcode layout, weight, profile and backup safety
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/ui_fixes_0737_test.gd
      - name: Test v0.7.35 last serving, half/piece/cup math and portion editor
        run: timeout --signal=SIGINT --kill-after=5s 90s /tmp/godot --headless --path godot --script res://tests/portion_0735_test.gd
      - name: Test portion math, saved sizes, 100ml products and diary migration
        run: /tmp/godot --headless --path godot --script res://tests/portion_test.gd
      - name: Smoke test app startup
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot --headless --path godot --quit-after 30 --verbose 2>&1 | tee /tmp/mybalance-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call\.|Invalid operands" /tmp/mybalance-smoke.log; then
            echo "Godot startup smoke test found script/runtime errors"
            exit 1
          fi
      - name: Export debug Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          /tmp/godot --headless --path godot --export-debug "Android" "$GITHUB_WORKSPACE/godot/build/MyBalance-debug.apk"
          test -s godot/build/MyBalance-debug.apk
          sha256sum godot/build/MyBalance-debug.apk
      - name: Check generated APK and report size
        shell: bash
        run: |
          test -s godot/build/MyBalance-debug.apk
          ls -lh godot/build/MyBalance-debug.apk
          sha256sum godot/build/MyBalance-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBalance-Godot-Android-APK
          path: godot/build/MyBalance-debug.apk
          if-no-files-found: error
          retention-days: 30
