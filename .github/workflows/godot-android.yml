name: Godot Android APK

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ${{ vars.GODOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"
      - name: Install Godot 4.6.3 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.6.3-stable"
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mv "/tmp/godot-bin/Godot_v${VERSION}_linux.x86_64" /tmp/godot
          chmod +x /tmp/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz"
          mkdir -p "/home/runner/.local/share/godot/export_templates/4.6.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "/home/runner/.local/share/godot/export_templates/4.6.3.stable/"
          /tmp/godot --headless --version
      - name: Configure Godot Android exporter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Validate project scripts and import resources
        run: /tmp/godot --headless --editor --path godot --quit --verbose
      - name: Export debug Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/build
          /tmp/godot --headless --path godot --export-debug "Android" "$GITHUB_WORKSPACE/godot/build/MyBalance-debug.apk"
          test -s godot/build/MyBalance-debug.apk
          sha256sum godot/build/MyBalance-debug.apk
      - name: Check generated APK and report size
        shell: bash
        run: |
          test -s godot/build/MyBalance-debug.apk
          ls -lh godot/build/MyBalance-debug.apk
          sha256sum godot/build/MyBalance-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBalance-Godot-Android-APK
          path: godot/build/MyBalance-debug.apk
          if-no-files-found: error
          retention-days: 30
