name: Open Food Facts regional barcode catalog
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/food-catalog.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate real food products
        run: python3 scripts/build_offline_food_catalog.py
      - name: Upload validated catalog
        uses: actions/upload-artifact@v4
        with:
          name: verified-offline-food-catalog
          path: godot/data/barcode_catalog.json
          if-no-files-found: error
