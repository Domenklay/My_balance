name: Open Food Facts regional barcode catalog
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/food-catalog.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate real food products
        run: python3 scripts/build_offline_food_catalog.py
      - name: Commit verified catalog into project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/data/barcode_catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Add curated verified Open Food Facts regional barcode catalog"
            git push
          fi
      - name: Upload validated catalog
        uses: actions/upload-artifact@v4
        with:
          name: verified-offline-food-catalog
          path: godot/data/barcode_catalog.json
          if-no-files-found: error
